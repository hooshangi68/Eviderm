<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eviderm Order Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-3xl shadow-xl p-6">

<h1 class="text-3xl font-bold mb-6">
ثبت سفارش آنلاین Eviderm
</h1>

<div id="step1">
<h2 class="font-bold mb-4">
آیا قبلاً با اویدرم همکاری داشته‌اید؟
</h2>

<div class="grid grid-cols-2 gap-4">
<button onclick="oldCustomer()" class="bg-green-600 text-white p-4 rounded-xl">
بله
</button>

<button onclick="newCustomer()" class="bg-blue-600 text-white p-4 rounded-xl">
خیر
</button>
</div>
</div>

<div id="newBox" class="hidden mt-6">
<input id="phone" placeholder="شماره تماس داروخانه" class="w-full border p-3 rounded-xl mb-3">
<input id="license" type="file" class="w-full border p-3 rounded-xl mb-3">

<button onclick="verifyNew()" class="bg-indigo-600 text-white p-3 rounded-xl">
تایید و ادامه
</button>
</div>

<div id="orderBox" class="hidden mt-6">

<input id="pharmacy" placeholder="نام داروخانه" class="w-full border p-3 rounded-xl mb-3">

<select id="category" class="w-full border p-3 rounded-xl mb-3" onchange="loadProducts()"></select>

<select id="product" class="w-full border p-3 rounded-xl mb-3"></select>

<input id="qty" type="number" min="1" value="1" class="w-full border p-3 rounded-xl mb-3">

<button onclick="addItem()" class="bg-pink-600 text-white p-3 rounded-xl">
افزودن به سبد
</button>

<div class="mt-5 bg-slate-50 rounded-2xl p-4">
<div class="flex justify-between">
<h3 class="font-bold">سبد سفارش</h3>
<span id="count">0 آیتم</span>
</div>
<div id="cart"></div>
</div>

<textarea id="description" rows="4" placeholder="توضیحات سفارش"
class="w-full border p-3 rounded-xl mt-4"></textarea>

<button onclick="sendOrder()" id="sendBtn"
class="bg-black text-white p-4 rounded-xl mt-4 w-full">
ارسال سفارش
</button>
  <button 
class="bg-black text-white p-4 rounded-xl mt-4 w-full">
<a href="https://hooshangi68.github.io/Eviderm/">بازگشت به صفحه اصلی</a>
</button>

</div>
</div>
</div>

<script>

const licenseInput = document.getElementById("license");
const phone = document.getElementById("phone");
const pharmacy = document.getElementById("pharmacy");
const description = document.getElementById("description");
const category = document.getElementById("category");
const product = document.getElementById("product");
const qty = document.getElementById("qty");
const cart = document.getElementById("cart");
const count = document.getElementById("count");
const sendBtn = document.getElementById("sendBtn");

const WEBHOOK = "https://eviderm.app.n8n.cloud/webhook/eviderm-order";

let basket = [];
let isNewCustomer = false; // ✅ اصلاح مهم

const products = {
"شامپوها":["پالمینکس","پالمینکس پلاس (دابل افکت)"],
"تونیک ها":["تونیک پالمینکس"]
};

Object.keys(products).forEach(x=>{
category.innerHTML += `<option>${x}</option>`;
});

function oldCustomer(){
isNewCustomer = false;
document.getElementById("step1").classList.add("hidden");
document.getElementById("orderBox").classList.remove("hidden");
loadProducts();
}

function newCustomer(){
isNewCustomer = true; // ✅ اصلاح مهم
document.getElementById("step1").classList.add("hidden");
document.getElementById("newBox").classList.remove("hidden");
}

function verifyNew(){

if(!phone.value || !licenseInput.files.length){
alert("شماره تماس و پروانه تاسیس الزامی است");
return;
}

document.getElementById("newBox").classList.add("hidden");
document.getElementById("orderBox").classList.remove("hidden");
loadProducts();
}

function loadProducts(){
let c = category.value;
product.innerHTML = products[c].map(x=>`<option>${x}</option>`).join("");
}

function addItem(){
basket.push({
category:category.value,
product:product.value,
qty:Number(qty.value)
});
renderBasket();
}

function renderBasket(){
count.innerText = basket.length+" آیتم";
cart.innerHTML="";
basket.forEach((x,i)=>{
cart.innerHTML += `
<div class="border-b py-2">
<b>${x.product}</b>
<div>تعداد: ${x.qty}</div>
<button onclick="removeItem(${i})"
class="bg-red-600 text-white px-2 rounded">حذف</button>
</div>`;
});
}

function removeItem(i){
basket.splice(i,1);
renderBasket();
}

async function sendOrder(){

if(!pharmacy.value){
alert("نام داروخانه را وارد کنید");
return;
}

if(basket.length===0){
alert("سبد سفارش خالی است");
return;
}

// ✅ چک درست مشتری جدید
if(isNewCustomer && !licenseInput.files.length){
alert("آپلود پروانه الزامی است");
return;
}

const formData = new FormData();

formData.append("pharmacy", pharmacy.value);
formData.append("phone", phone.value || "ثبت نشده");
formData.append("items", JSON.stringify(basket));
formData.append("description", description.value);
formData.append("orderDate", new Date().toLocaleString("fa-IR"));

// ✅ ارسال فایل
if(isNewCustomer){
formData.append("license", licenseInput.files[0]);
}

sendBtn.disabled = true;

try{

const res = await fetch(WEBHOOK,{
method:"POST",
body:formData
});

if(!res.ok){
throw new Error("Webhook failed");
}

alert("✅ سفارش با موفقیت ارسال شد");

basket=[];
renderBasket();
description.value="";

}catch(e){
console.error(e);
alert("❌ خطا در ارسال سفارش");
}

sendBtn.disabled = false;
}

loadProducts();

</script>

</body>
</html>
