
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eviderm Order Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-3xl shadow-xl p-6">

<h1 class="text-3xl font-bold mb-6">
ثبت سفارش آنلاین Eviderm
</h1>

<div id="step1">
<h2 class="font-bold mb-4">
آیا قبلاً با اویدرم همکاری داشته‌اید؟
</h2>

<div class="grid grid-cols-2 gap-4">
<button onclick="oldCustomer()" class="bg-green-600 text-white p-4 rounded-xl">
بله
</button>

<button onclick="newCustomer()" class="bg-blue-600 text-white p-4 rounded-xl">
خیر
</button>
</div>
</div>



<div id="newBox" class="hidden mt-6"></div>
</div>

<div id="orderBox" class="hidden mt-6">

<input id="pharmacy" placeholder="نام داروخانه" class="w-full border p-3 rounded-xl mb-3">

<select id="category" class="w-full border p-3 rounded-xl mb-3" onchange="loadProducts()"></select>

<select id="product" class="w-full border p-3 rounded-xl mb-3"></select>

<input id="qty" type="number" min="1" value="1" class="w-full border p-3 rounded-xl mb-3">

<button onclick="addItem()" class="bg-pink-600 text-white p-3 rounded-xl">
افزودن به سبد
</button>

<div class="mt-5 bg-slate-50 rounded-2xl p-4">
<div class="flex justify-between">
<h3 class="font-bold">سبد سفارش</h3>
<span id="count">0 آیتم</span>
</div>
<div id="cart"></div>
</div>

<textarea id="description" rows="4" placeholder="توضیحات سفارش"
class="w-full border p-3 rounded-xl mt-4"></textarea>

<button onclick="sendOrder()" id="sendBtn"
class="bg-black text-white p-4 rounded-xl mt-4 w-full">
ارسال سفارش
</button>
  <a href="https://hooshangi68.github.io/Eviderm/" class="bg-black text-white p-4 rounded-xl mt-4 w-full block text-center">بازگشت به صفحه اصلی</a>

</div>
</div>
</div>

<script>


const phone={value:""};
const pharmacy = document.getElementById("pharmacy");
const description = document.getElementById("description");
const category = document.getElementById("category");
const product = document.getElementById("product");
const qty = document.getElementById("qty");
const cart = document.getElementById("cart");
const count = document.getElementById("count");
const sendBtn = document.getElementById("sendBtn");

const WEBHOOK = "https://script.google.com/macros/s/AKfycbzBhahymIpAlNCMN8suTpVIlpjN9pJu_O_gaFcaJgM5Wl7rX9LVz0r-JXMXjHbUJ_Bp/exec";

let basket = [];
let isNewCustomer = false; // ✅ اصلاح مهم

const products = {

"شامپوها":[
"پالمینکس",
"پالمینکس پلاس (دابل افکت)",
"فوم پالمینکس پلاس (فوم کاشت)",
"سیکلوزینک",
"اکتوزینک",
"سیکلو جی",
"سیکلو دی",
"کراستم جی",
"کراستم دی",
"سبونورم جی",
"سبونورم دی",
"رنگ شده اوی کالر",
"خشک اوی درای",
"حجم دهنده اوی ولوم",
"روزانه اوی دیلی",
"سولفات فری تقویتی",
"سولفات فری چرب",
"سولفات فری کراتینه خشک",
"سولفات فری کراتینه رنگ شده",
"سولفات فری ضدشوره"
],

"تونیک ها":[
"تونیک پالمینکس",
"تونیک کراستم",
"تونیک پالمینکس پلاس"
],

"سرم مو":[
"سرم آرگان درای",
"سرم کالر"
],

"ماسک مو":[
"ماسک موی خشک"
],

"نرم کننده":[
"نرم کننده درای",
"نرم کننده کالر"
],

"پن ها":[
"پن خشک",
"پن چرب",
"پن روشن کننده"
],

"فوم های شستشوی صورت":[
"فوم خشک",
"فوم چرب",
"فوم روشن کننده",
"فوم براشدار هیالورونیک اسید",
"فوم براشدار نیاسین آمید",
"فوم براشدار ترامگزامیک اسید",
"فوم براشدار رتینول",
"فوم براشدار AHA",
"فوم براشدار ویتامین سی"
],

"مرطوب کننده و آبرسان":[
"مرطوب کننده و آبرسان پوست خشک",
"مرطوب کننده و آبرسان فاقدچربی پوست نرمال تا مختلط",
"مرطوب کننده و آبرسان پوست چرب",
"کرم دست (تیوپی)",
"کرم دست (پمپی 200 میل)"
],

"ضدآفتاب ها":[
"ضدآفتاب بی رنگ پوست خشک",
"ضدآفتاب بی رنگ پوست چرب",
"ضدآفتاب رنگی لایت بژ پوست خشک",
"ضدآفتاب رنگی لایت بژ پوست چرب",
"ضدآفتاب رنگی ضدلک",
"ضدآفتاب رنگی ضدجوش"
],

"کرم های تخصصی پوستی":[
"کرم ضدچروک رتینول",
"کرم ضدلک",
"کرم دورچشم",
"کرم AHA 10%",
"کرم AHA 15%",
"کرم ویتامین سی"
],

"ژل های بانوان":[
"ژل بانوان ساده بزرگسال",
"ژل بانوان ضدقارچ",
"ژل بانوان روشن کننده"
],

"میسلارواترها":[
"میسلار خشک",
"میسلار چرب"
],

"شامپوهای بدن":[
"شامپو بدن کرمی هیدرا",
"شامپو بدن ضدقارچ سیکلوزینک"
],

"EviKids":[
"شامپو سر و بدن کودک",
"شامپو فوم نوزاد",
"لوسیون بدن کودک",
"شامپو ضدشوره کودک"
],

"Evisensitive":[
"کرم آرنیکا ضدکبودی و ضددرد",
"کرم ترمیم زخم",
"کرم سیلیکونی ترمیم زخم",
"فوم شستشو و ترمیم زخم",
"اسپری آرنیکا ضدکبودی و ضددرد",
"اسپری ترمیم زخم",
"کرم ترمیم کننده تتو (7 میل)",
"کرم ترمیم کننده تتو (50 میل)",
"بالم لب",
"کرم مرطوب کننده قوی دورچشم",
"فوم شستشوی پلک و مژه",
"کرم ترمیم ناخن"
]

};


Object.keys(products).forEach(x=>{
category.innerHTML += `<option>${x}</option>`;
});

function oldCustomer(){
isNewCustomer = false;
document.getElementById("step1").classList.add("hidden");
document.getElementById("orderBox").classList.remove("hidden");
loadProducts();
}

function newCustomer(){

isNewCustomer = true;

document.getElementById("step1").classList.add("hidden");

document.getElementById("newBox").innerHTML = `

<div class="bg-yellow-50 border border-yellow-300 rounded-2xl p-5 text-center">

<h2 class="text-2xl font-bold mb-4">
🆕 مشتری جدید
</h2>

<p class="mb-4 leading-8">
جهت شروع همکاری با شرکت اویدرم، لطفاً ابتدا تصویر پروانه تأسیس داروخانه را
از طریق واتساپ به شماره زیر ارسال نمایید.
</p>

<a
href="https://wa.me/989053378282?text=سلام،%20جهت%20شروع%20همکاری%20با%20اویدرم%20تصویر%20پروانه%20تأسیس%20داروخانه%20را%20ارسال%20می‌کنیم."
target="_blank"
class="bg-green-600 text-white px-6 py-3 rounded-xl inline-block mt-3">

📲 ارسال در واتساپ

</a>

<div class="mt-6">

<label class="flex items-center justify-center gap-2">

<input type="checkbox" id="licenseSent">

<span>تصویر پروانه را ارسال کرده‌ام.</span>

</label>

</div>

<button
onclick="verifyNew()"
class="bg-indigo-600 text-white px-8 py-3 rounded-xl mt-6">

ادامه ثبت سفارش

</button>

</div>

`;

document.getElementById("newBox").classList.remove("hidden");

}

function verifyNew(){
  const chk = document.getElementById("licenseSent");

if(!chk || !chk.checked){

alert("ابتدا تیک را بزنید.");

return;

}

if(!document.getElementById("licenseSent").checked){

alert("لطفاً ابتدا تصویر پروانه تأسیس را از طریق واتساپ ارسال نمایید.");

return;

}

document.getElementById("newBox").classList.add("hidden");

document.getElementById("orderBox").classList.remove("hidden");

loadProducts();

}

function loadProducts(){
let c = category.value;
product.innerHTML = products[c].map(x=>`<option>${x}</option>`).join("");
}

function addItem(){
basket.push({
category:category.value,
product:product.value,
qty:Number(qty.value)
});
renderBasket();
}

function renderBasket(){
count.innerText = basket.length+" آیتم";
cart.innerHTML="";
basket.forEach((x,i)=>{
cart.innerHTML += `
<div class="border-b py-2">
<b>${x.product}</b>
<div>تعداد: ${x.qty}</div>
<button onclick="removeItem(${i})"
class="bg-red-600 text-white px-2 rounded">حذف</button>
</div>`;
});
}

function removeItem(i){
basket.splice(i,1);
renderBasket();
}

async function sendOrder() {

    if (!pharmacy.value.trim()) {
        alert("نام داروخانه را وارد کنید");
        return;
    }

    if (basket.length === 0) {
        alert("حداقل یک محصول انتخاب کنید");
        return;
    }

    sendBtn.disabled = true;
    sendBtn.innerText = "در حال ارسال...";

    const order = {
        pharmacy: pharmacy.value.trim(),
        phone: phone.value.trim() || "",
        items: basket,
        description: description.value.trim(),
        orderDate: new Date().toISOString()
    };

    try {

    const response = await fetch(WEBHOOK, {
    method: "POST",
    mode: "cors",
    body: JSON.stringify(order)
});

    const text = await response.text();

    console.log(text);

    const result = JSON.parse(text);

    if(result.success){

        alert("سفارش ثبت شد");

    }else{

        alert(result.error);

    }

} catch (err) {

        console.error(err);

        alert("ارتباط با سرور برقرار نشد.");

    }

    sendBtn.disabled = false;
    sendBtn.innerText = "ارسال سفارش";

}

loadProducts();

</script>

</body>
</html>
