<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eviderm Order Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
<div class="max-w-6xl mx-auto p-4">
<div class="bg-white rounded-3xl shadow-xl p-6">
<h1 class="text-3xl font-bold mb-6">ثبت سفارش آنلاین Eviderm</h1>

<div id="step1">
<h2 class="font-bold mb-4">آیا قبلاً با اویدرم همکاری داشته‌اید؟</h2>
<div class="grid grid-cols-2 gap-4">
<button onclick="oldCustomer()" class="bg-green-600 text-white p-4 rounded-xl">بله</button>
<button onclick="newCustomer()" class="bg-blue-600 text-white p-4 rounded-xl">خیر</button>
</div>
</div>

<div id="newBox" class="hidden mt-6">
<input id="phone" placeholder="شماره تماس داروخانه" class="w-full border p-3 rounded-xl mb-3">
<input id="license" type="file" class="w-full border p-3 rounded-xl mb-3">
<button onclick="verifyNew()" class="bg-indigo-600 text-white p-3 rounded-xl">تایید و ادامه</button>
</div>

<div id="orderBox" class="hidden mt-6">
<input id="pharmacy" placeholder="نام داروخانه" class="w-full border p-3 rounded-xl mb-3">

<select id="category" class="w-full border p-3 rounded-xl mb-3" onchange="loadProducts()"></select>
<select id="product" class="w-full border p-3 rounded-xl mb-3"></select>
<input id="qty" type="number" min="1" value="1" class="w-full border p-3 rounded-xl mb-3">

<button onclick="addItem()" class="bg-pink-600 text-white p-3 rounded-xl">افزودن به سبد</button>

<div class="mt-5 bg-slate-50 rounded-2xl p-4">
<div class="flex justify-between"><h3 class="font-bold">سبد سفارش</h3><span id="count">0 آیتم</span></div>
<div id="cart"></div>
</div>

<textarea id="description" rows="4" placeholder="توضیحات سفارش" class="w-full border p-3 rounded-xl mt-4"></textarea>

<button onclick="sendOrder()" class="bg-black text-white p-4 rounded-xl mt-4 w-full">ارسال سفارش</button>
</div>
</div></div>

<script>

const products = {
"شامپوها":["پالمینکس","پالمینکس پلاس (دابل افکت)","فوم پالمینکس پلاس (فوم کاشت)","سیکلوزینک","اکتوزینک","سیکلو جی","سیکلو دی","کراستم جی","کراستم دی","سبونورم جی","سبونورم دی","رنگ شده اوی کالر","خشک اوی درای","حجم دهنده اوی ولوم","روزانه اوی دیلی","سولفات فری تقویتی","سولفات فری چرب","سولفات فری کراتینه خشک","سولفات فری کراتینه رنگ شده","سولفات فری ضدشوره"],
"تونیک ها":["تونیک پالمینکس","تونیک کراستم","تونیک پالمینکس پلاس"],
"سرم مو":["سرم آرگان درای","سرم کالر"],
"ماسک مو":["ماسک موی خشک"],
"نرم کننده":["نرم کننده درای","نرم کننده کالر"],
"پن ها":["پن خشک","پن چرب","پن روشن کننده"],
"فوم های شستشوی صورت":["فوم خشک","فوم چرب","فوم روشن کننده","فوم براشدار هیالورونیک اسید","فوم براشدار نیاسین آمید","فوم براشدار ترامگزامیک اسید","فوم براشدار رتینول","فوم براشدار AHA","فوم براشدار ویتامین سی"],
"مرطوب کننده و آبرسان":["مرطوب کننده و آبرسان پوست خشک","مرطوب کننده و آبرسان فاقدچربی پوست نرمال تا مختلط","مرطوب کننده و آبرسان پوست چرب","کرم دست (تیوپی)","کرم دست (پمپی 200 میل)"],
"ضدآفتاب ها":["ضدآفتاب بی رنگ پوست خشک","ضدآفتاب بی رنگ پوست چرب","ضدآفتاب رنگی لایت بژ پوست خشک","ضدآفتاب رنگی لایت بژ پوست چرب","ضدآفتاب رنگی ضدلک","ضدآفتاب رنگی ضدجوش"],
"کرم های تخصصی پوستی":["کرم ضدچروک رتینول","کرم ضدلک","کرم دورچشم","کرم AHA 10%","کرم AHA 15%","کرم ویتامین سی"],
"ژل های بانوان":["ژل بانوان ساده بزرگسال","ژل بانوان ضدقارچ","ژل بانوان روشن کننده"],
"میسلارواترها":["میسلار خشک","میسلار چرب"],
"شامپوهای بدن":["شامپو بدن کرمی هیدرا","شامپو بدن ضدقارچ سیکلوزینک"],
"EviKids":["شامپو سر و بدن کودک","شامپو فوم نوزاد","لوسیون بدن کودک","شامپو ضدشوره کودک"],
"Evisensitive":["کرم آرنیکا ضدکبودی و ضددرد","کرم ترمیم زخم","کرم سیلیکونی ترمیم زخم","فوم شستشو و ترمیم زخم","اسپری آرنیکا ضدکبودی و ضددرد","اسپری ترمیم زخم","کرم ترمیم کننده تتو (7 میل)","کرم ترمیم کننده تتو (50 میل)","بالم لب","کرم مرطوب کننده قوی دورچشم","فوم شستشوی پلک و مژه","کرم ترمیم ناخن"]
};


let basket=[];

Object.keys(products).forEach(c=>category.innerHTML += `<option>${c}</option>`);

function oldCustomer(){
 document.getElementById('step1').classList.add('hidden');
 document.getElementById('orderBox').classList.remove('hidden');
 const saved=localStorage.getItem('evidermPharmacy');
 if(saved) pharmacy.value=saved;
 loadProducts();
}

function newCustomer(){
 document.getElementById('step1').classList.add('hidden');
 document.getElementById('newBox').classList.remove('hidden');
}

function verifyNew(){
 if(!phone.value || !license.files.length){alert('شماره تماس و پروانه الزامی است');return;}
 document.getElementById('newBox').classList.add('hidden');
 document.getElementById('orderBox').classList.remove('hidden');
 loadProducts();
}

function loadProducts(){
 let c=category.value;
 product.innerHTML=products[c].map(p=>`<option>${p}</option>`).join('');
}

function filterProducts(){
 let c=category.value;
 let q=search.value.trim();
 product.innerHTML=products[c].filter(x=>x.includes(q)).map(p=>`<option>${p}</option>`).join('');
}

function addItem(){
 basket.push({
  category:category.value,
  product:product.value,
  qty:Number(qty.value)
 });
 renderBasket();
}

function renderBasket(){
 count.innerText=basket.length + " آیتم";
 cart.innerHTML='';
 basket.forEach((i,idx)=>{
 cart.innerHTML += `
 <div class="flex justify-between items-center border-b py-2">
   <div>
   <div class="font-semibold">${i.product}</div>
   <div class="text-sm text-gray-500">تعداد: ${i.qty}</div>
   </div>
   <div class="flex gap-2">
     <button onclick="editQty(${idx})" class="bg-yellow-500 text-white px-2 py-1 rounded">ویرایش</button>
     <button onclick="removeItem(${idx})" class="bg-red-600 text-white px-2 py-1 rounded">حذف</button>
   </div>
 </div>`;
 });
}

function removeItem(i){ basket.splice(i,1); renderBasket(); }

function editQty(i){
 let n=prompt('تعداد جدید',basket[i].qty);
 if(n){ basket[i].qty=Number(n); renderBasket(); }
}

function sendOrder(){
 if(!pharmacy.value){alert('نام داروخانه را وارد کنید');return;}
 if(basket.length===0){alert('حداقل یک محصول انتخاب کنید');return;}

 localStorage.setItem('evidermPharmacy',pharmacy.value);

 const payload={
  pharmacy:pharmacy.value,
  phone:phone.value,
  items:basket,
  description:description.value,
  orderDate:new Date().toLocaleString('fa-IR')
 };

 console.log(payload);

 // آدرس وبهوک را اینجا قرار بده
 // fetch("YOUR_N8N_WEBHOOK",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})

 alert('Webhook را در تابع sendOrder جایگزین کن.');
}

loadProducts();
</script></body></html>
